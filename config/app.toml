#:schema ../.chromatis/schemas/app.schema.json
[deployment]
target = "cloudflare"
domain = "studyluma.org"
name = "studyluma-demo"

# The Demo runs no Classroom Sessions: the classroom module's routes, runtime
# and server hook drop out. It hosts the gateway (`studyluma.org/CODE`), see
# config/directory.toml.
[modules]
disabled = ["classroom"]

# The Demo's own landing page replaces the package's index redirect.
[routes]
omit = ["/"]
